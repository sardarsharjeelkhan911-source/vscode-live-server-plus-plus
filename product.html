<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyStore | Product</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="product">
  <header class="site-header">
    <nav class="navbar container" aria-label="Primary navigation">
      <a href="index.html" class="brand">MyStore</a>
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="cart.html">Cart (<span id="cartCount">0</span>)</a></li>
        <li><a href="tracking.html">Track Order</a></li>
      </ul>
      <form id="navbarSearchForm" class="nav-search" role="search">
        <label for="navbarSearch" class="sr-only">Search products</label>
        <input id="navbarSearch" name="q" type="search" placeholder="Search" />
      </form>
    </nav>
  </header>

  <main class="container section">
    <div id="productDetails"></div>
    <section class="section">
      <h2>Related Products</h2>
      <div id="relatedProducts" class="product-grid"></div>
    </section>
  </main>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
