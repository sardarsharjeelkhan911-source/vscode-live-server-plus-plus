<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyStore | Admin Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="admin">
  <header class="site-header">
    <nav class="navbar container" aria-label="Primary navigation">
      <a href="index.html" class="brand">MyStore Admin</a>
      <ul class="nav-links" id="adminNavLinks">
        <li><a href="index.html">Storefront</a></li>
        <li><button id="logoutBtn" class="btn btn-secondary" type="button">Logout</button></li>
      </ul>
    </nav>
  </header>

  <main class="container section">
    <section id="adminLoginSection" class="card narrow">
      <h1>Admin Login</h1>
      <form id="adminLoginForm">
        <label for="adminUsername">Username</label>
        <input id="adminUsername" required />
        <label for="adminPassword">Password</label>
        <input id="adminPassword" type="password" required />
        <button class="btn btn-primary" type="submit">Login</button>
      </form>
    </section>

    <section id="adminDashboard" class="hidden">
      <h1>Dashboard</h1>
      <div id="metricCards" class="metrics-grid"></div>

      <div class="admin-grid">
        <section class="card">
          <h2>Product Management</h2>
          <form id="productForm" class="stack">
            <input type="hidden" id="productId" />
            <label for="productName">Name</label>
            <input id="productName" required />
            <label for="productImage">Image URL/Path</label>
            <input id="productImage" required />
            <label for="productCategory">Category</label>
            <select id="productCategory" required></select>
            <label for="productPrice">Price</label>
            <input id="productPrice" type="number" min="0" step="1" required />
            <label for="productDiscount">Discount Price</label>
            <input id="productDiscount" type="number" min="0" step="1" />
            <label for="productStock">Stock</label>
            <input id="productStock" type="number" min="0" step="1" required />
            <label for="productDescription">Description</label>
            <textarea id="productDescription" required></textarea>
            <button class="btn btn-primary" type="submit">Save Product</button>
            <button class="btn btn-secondary" id="productResetBtn" type="button">Clear</button>
          </form>
          <div class="table-wrap"><table><thead><tr><th>Name</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody id="adminProductsBody"></tbody></table></div>
        </section>

        <section class="card">
          <h2>Category Management</h2>
          <form id="categoryForm" class="stack-inline">
            <input type="hidden" id="categoryId" />
            <input id="categoryName" placeholder="Category name" required />
            <button class="btn btn-primary" type="submit">Save Category</button>
            <button class="btn btn-secondary" id="categoryResetBtn" type="button">Clear</button>
          </form>
          <ul id="categoryList" class="list"></ul>
        </section>
      </div>

      <section class="card">
        <h2>Order Management</h2>
        <div class="filters">
          <div><label for="orderSearch">Search</label><input id="orderSearch" placeholder="Order ID or customer" /></div>
          <div><label for="orderStatusFilter">Status</label>
            <select id="orderStatusFilter"></select>
          </div>
        </div>
        <div class="table-wrap"><table><thead><tr><th>Order ID</th><th>Customer</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody id="ordersBody"></tbody></table></div>
      </section>

      <section class="admin-grid">
        <section class="card">
          <h2>Customer Management</h2>
          <div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Address</th><th>Orders</th><th>Spending</th></tr></thead><tbody id="customersBody"></tbody></table></div>
        </section>

        <section class="card">
          <h2>Sales Reports</h2>
          <div id="salesReport"></div>
        </section>
      </section>
    </section>
  </main>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
